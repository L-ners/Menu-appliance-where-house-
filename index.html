<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Appliance Warehouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0082e6; /* Blue background */
            margin: 0;
            padding: 0;
        }

        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
            margin: 100px auto;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background-color: #333;
        }

        .generate-btn {
            margin-top: 10px;
            background-color: #005a9e;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .error-message {
            color: red;
            font-size: 14px;
        }

        /* Logo and navbar styling */
        .navbar {
            background-color: #0082e6;
            padding: 10px;
            text-align: center;
        }

        .navbar img {
            height: 150px; /* Increased height for bigger logo */
            width: auto;   /* Auto width to maintain aspect ratio */
        }

    </style>
</head>
<body>

<div class="navbar">
    <img src="https://github.com/L-ners/appliance-wherehouse-/blob/main/logo.png?raw=true" alt="Appliance Warehouse Logo">
</div>

<div class="login-container">
    <form id="loginForm">
        <input type="text" id="email" name="email" placeholder="Email">
        <input type="password" id="password" name="password" placeholder="Password" maxlength="32">
        <p id="error-message" class="error-message"></p>
        <button type="submit" class="login-btn">Log in</button>
    </form>
    <button id="generateBtn" class="generate-btn">Set Email & Password</button>
</div>

<script>
    let customEmail = '';
    let customPassword = '';

    document.getElementById('generateBtn').addEventListener('click', function() {
        customEmail = prompt("Please enter your custom email:");
        customPassword = prompt("Please enter your custom password:");

        if (customEmail && customPassword) {
            alert(`Email: ${customEmail}\nPassword: ${customPassword}`);
        } else {
            alert('Please provide both email and password.');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const inputEmail = document.getElementById('email').value;
        const inputPassword = document.getElementById('password').value;

        if (inputEmail === customEmail && inputPassword === customPassword) {
            window.location.href = 'appliance_system_dashboard.html'; // Redirect to your main system page
        } else {
            document.getElementById('error-message').textContent = 'Invalid email or password. Please use the correct credentials.';
        }
    });
</script>

</body>
</html>
